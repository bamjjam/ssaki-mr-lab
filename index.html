<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쌓기나무 MR 탐구실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3efe7; font-family: "Noto Sans KR", sans-serif; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 16px; top: 16px; max-width: 360px;
    background: rgba(255,255,255,0.94); border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 6px 24px rgba(60,40,10,0.15); color: #3b2a14;
  }
  #ui h1 { margin: 0 0 4px; font-size: 20px; font-weight: 900; }
  #ui p { margin: 6px 0; font-size: 13.5px; line-height: 1.55; }
  .btns { display: flex; gap: 8px; margin: 12px 0 6px; flex-wrap: wrap; }
  .btns button {
    font: 700 15px "Noto Sans KR", sans-serif; border: 0; border-radius: 10px;
    padding: 10px 14px; cursor: pointer; color: #fff; background: #c27a2c;
  }
  .btns button.vr { background: #5b6b8c; }
  .btns button:disabled { background: #bbb; cursor: not-allowed; }
  #status { font-size: 12.5px; color: #7a6a55; }
  kbd { background: #eee4d3; border-radius: 4px; padding: 0 5px; font-size: 12px; }
  #toggle { position: absolute; right: 10px; top: 8px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #9a8a75; }
</style>
</head>
<body>
<div id="ui">
  <button id="toggle" title="접기">–</button>
  <h1>쌓기나무 MR 탐구실</h1>
  <div id="uiBody">
    <p>책상 위에 쌓기나무를 쌓고, <b>앞·옆·위에서 본 모양</b>이 어떻게 바뀌는지 바로 확인해 보세요.</p>
    <div class="btns">
      <button id="btnAR" disabled>MR로 시작 (책상 위에)</button>
      <button id="btnVR" class="vr" disabled>VR로 시작</button>
    </div>
    <p id="status">기기 확인 중…</p>
    <p><b>헤드셋</b>: 손가락을 꼬집듯 모으거나(핀치) 컨트롤러 방아쇠를 당기면 쌓여요. 컨트롤러 옆 버튼(그립)을 누르면 빠져요.<br>
       <b>PC 미리보기</b>: 클릭 = 쌓기, <kbd>우클릭</kbd> 또는 <kbd>Shift</kbd>+클릭 = 빼기, 드래그 = 돌려보기</p>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 기본 설정 ----------
const N = 5;          // 판 크기 5×5
const H = 5;          // 최대 5층
const CELL = 0.06;    // 쌓기나무 한 변 6cm
const HALF = N * CELL / 2;
const FONT = '"Noto Sans KR", sans-serif';

// 각 칸의 높이만 저장 (쌓기나무는 아래가 받쳐져야 하므로 기둥은 항상 바닥부터 이어짐)
let h = makeHeights();
let mode = 'add';            // 'add' | 'remove'
let quiz = -1;               // -1 = 자유 쌓기
let solved = false;
let message = null;

function makeHeights() { return Array.from({ length: N }, () => Array(N).fill(0)); }

// 문제: 줄은 뒤(z=0)→앞(z=4), 글자는 왼쪽(x=0)→오른쪽, 숫자 = 그 칸에 쌓인 개수
const PRESETS = [
  ['00000', '00000', '02100', '01100', '00000'],
  ['00000', '00100', '01310', '00100', '00000'],
  ['00000', '01200', '02310', '01100', '00000'],
  ['00000', '03210', '02100', '01000', '00000'],
  ['00000', '01110', '01310', '01110', '00000'],
].map(rows => {
  const t = makeHeights();
  rows.forEach((row, z) => [...row].forEach((ch, x) => { t[x][z] = +ch; }));
  return t;
});

// ---------- 장면 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
// 헤드셋에서 글자가 또렷하게 보이도록 렌더링 해상도를 올리고, 가장자리 흐림(포비에이션)을 끔
renderer.xr.setFramebufferScaleFactor(1.6);
renderer.xr.setFoveation(0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color('#f3efe7');
scene.background = BG;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0.32, 0.5, 0.72);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.13, -0.05);
controls.enableDamping = true;
controls.minDistance = 0.25; controls.maxDistance = 2;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.6, 1.2, 0.9);
scene.add(sun);

// 쌓기나무 판 전체를 담는 그룹 (MR에서는 사용자 앞 책상 높이로 옮김)
const world = new THREE.Group();
scene.add(world);

// 판
const base = new THREE.Mesh(
  new THREE.BoxGeometry(N * CELL + 0.02, 0.008, N * CELL + 0.02),
  new THREE.MeshStandardMaterial({ color: '#efe6d4', roughness: 0.9 })
);
base.position.y = -0.004;
world.add(base);

const gridPts = [];
for (let i = 0; i <= N; i++) {
  const p = -HALF + i * CELL;
  gridPts.push(p, 0.0006, -HALF, p, 0.0006, HALF, -HALF, 0.0006, p, HALF, 0.0006, p);
}
const gridGeo = new THREE.BufferGeometry();
gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridPts, 3));
world.add(new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({ color: '#b9a582' })));

// VR 모드에서만 보이는 책상과 바닥
const vrRoom = new THREE.Group();
const desk = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.6), new THREE.MeshStandardMaterial({ color: '#a8835a' }));
desk.position.set(0, -0.028, 0.05);
vrRoom.add(desk);
vrRoom.visible = false;
world.add(vrRoom);
const floorGrid = new THREE.GridHelper(6, 30, 0x999999, 0xcccccc);
floorGrid.visible = false;
scene.add(floorGrid);

// ---------- 글자 텍스처 도우미 ----------
// s = 실제 픽셀 배율 (그리는 좌표는 w×hgt 그대로, 텍스처는 s배 선명하게)
function canvasTexture(w, hgt, s = 1) {
  const c = document.createElement('canvas'); c.width = w * s; c.height = hgt * s;
  const ctx = c.getContext('2d');
  ctx.setTransform(s, 0, 0, s, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { c, ctx, tex };
}
function roundRect(ctx, x, y, w, hh, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r);
  ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function flatLabel(text, w, x, z, rotZ = 0) {
  const { ctx, tex } = canvasTexture(256, 96);
  ctx.fillStyle = '#8a6a3c'; ctx.font = `900 64px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 128, 50);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 96 / 256),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }));
  m.rotation.set(-Math.PI / 2, 0, rotZ);
  m.position.set(x, 0.001, z);
  m.userData.redraw = () => {
    ctx.clearRect(0, 0, 256, 96); ctx.fillStyle = '#8a6a3c'; ctx.font = `900 64px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 128, 50); tex.needsUpdate = true;
  };
  world.add(m);
  return m;
}
const labels = [
  flatLabel('앞', 0.06, 0, HALF + 0.022),
  flatLabel('옆', 0.06, HALF + 0.022, 0, Math.PI / 2),
];

// ---------- 버튼 (헤드셋·PC 공용) ----------
const BUTTONS = [
  { id: 'add', label: '쌓기' },
  { id: 'remove', label: '빼기' },
  { id: 'clear', label: '초기화' },
  { id: 'quiz', label: '문제' },
  { id: 'move', label: '옮기기' },
];
const buttonMeshes = [];
BUTTONS.forEach((b, i) => {
  const { ctx, tex } = canvasTexture(256, 112, 2);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.0438),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }));
  mesh.position.set((i - 2) * 0.108, 0.03, HALF + 0.085);
  mesh.rotation.x = -0.85;   // 사용자 쪽으로 세워서 잘 보이게
  mesh.userData = { button: b.id, ctx, tex, def: b };
  world.add(mesh);
  buttonMeshes.push(mesh);
});
function drawButtons() {
  for (const m of buttonMeshes) {
    const { ctx, tex, def } = m.userData;
    const active = (def.id === mode) || (def.id === 'quiz' && quiz >= 0);
    ctx.clearRect(0, 0, 256, 112);
    roundRect(ctx, 4, 4, 248, 104, 26);
    ctx.fillStyle = active ? (def.id === 'remove' ? '#c9483b' : def.id === 'quiz' ? '#4f6fb0' : '#c27a2c') : '#fffaf2';
    ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = active ? 'rgba(0,0,0,0.15)' : '#d8c7a8'; ctx.stroke();
    ctx.fillStyle = active ? '#fff' : '#5a4326';
    ctx.font = `900 50px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const text = def.id === 'quiz' && quiz >= 0 ? `문제 ${quiz + 1}` : def.label;
    ctx.fillText(text, 128, 60);
    tex.needsUpdate = true;
  }
}

// ---------- 앞·옆·위 모양 패널 ----------
const PW = 1024, PH = 640;
const panel = canvasTexture(PW, PH, 2);
const panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.56 * PH / PW),
  new THREE.MeshBasicMaterial({ map: panel.tex, transparent: true, toneMapped: false }));
panelMesh.position.set(0, 0.29, -HALF - 0.08);
panelMesh.rotation.x = -0.08;
world.add(panelMesh);

function project(hh) {
  const front = [], side = [], top = [];
  for (let c = 0; c < N; c++) {
    front.push([]); side.push([]); top.push([]);
    for (let y = 0; y < H; y++) {
      let f = false, s = false;
      for (let k = 0; k < N; k++) {
        if (hh[c][k] > y) f = true;            // 앞에서: x열, z방향으로 겹침
        if (hh[k][N - 1 - c] > y) s = true;    // 오른쪽 옆에서: 왼쪽이 앞(z=4)
      }
      front[c].push(f); side[c].push(s);
    }
    for (let z = 0; z < N; z++) top[c].push(hh[c][z] > 0);
  }
  return { front, side, top };
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const count = hh => hh.flat().reduce((a, b) => a + b, 0);

function drawPane(ctx, x0, y0, title, filled, color, nums, ok) {
  ctx.fillStyle = '#5a4326'; ctx.font = `700 26px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, x0, y0 + 24);
  const gx = x0, gy = y0 + 36, s = 44, size = s * N;
  ctx.fillStyle = '#fff'; ctx.fillRect(gx, gy, size, size);
  for (let c = 0; c < N; c++) for (let r = 0; r < N; r++) {
    if (filled(c, r)) {
      ctx.fillStyle = color; ctx.fillRect(gx + c * s, gy + r * s, s, s);
      if (nums) {
        const n = nums(c, r);
        ctx.fillStyle = '#fff'; ctx.font = `900 26px ${FONT}`; ctx.textAlign = 'center';
        ctx.fillText(n, gx + c * s + s / 2, gy + r * s + s / 2 + 9); ctx.textAlign = 'left';
      }
    }
  }
  ctx.strokeStyle = '#cdbb9a'; ctx.lineWidth = 2;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(gx + i * s, gy); ctx.lineTo(gx + i * s, gy + size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(gx, gy + i * s); ctx.lineTo(gx + size, gy + i * s); ctx.stroke();
  }
  if (ok !== undefined) {
    ctx.strokeStyle = ok ? '#2f9e5b' : '#e0d3bb'; ctx.lineWidth = ok ? 7 : 3;
    ctx.strokeRect(gx - 4, gy - 4, size + 8, size + 8);
  }
}

function drawRow(ctx, y0, hh, color, withNums, target) {
  const p = project(hh);
  const tp = target ? project(target) : null;
  const xs = [150, 440, 730];
  drawPane(ctx, xs[0], y0, '앞에서 본 모양', (c, r) => p.front[c][H - 1 - r], color, null, tp ? same(p.front, tp.front) : undefined);
  drawPane(ctx, xs[1], y0, '오른쪽 옆에서 본 모양', (c, r) => p.side[c][H - 1 - r], color, null, tp ? same(p.side, tp.side) : undefined);
  drawPane(ctx, xs[2], y0, '위에서 본 모양', (c, r) => p.top[c][r], color,
    withNums ? (c, r) => hh[c][r] : null, tp ? same(p.top, tp.top) : undefined);
}

function drawPanel() {
  const { ctx, tex } = panel;
  ctx.clearRect(0, 0, PW, PH);
  roundRect(ctx, 0, 0, PW, PH, 36); ctx.fillStyle = 'rgba(255,251,244,0.96)'; ctx.fill();

  // 머리줄
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = '#3b2a14'; ctx.font = `900 36px ${FONT}`;
  ctx.fillText(`쌓기나무 ${count(h)}개`, 36, 52);
  ctx.font = `700 26px ${FONT}`; ctx.fillStyle = mode === 'add' ? '#c27a2c' : '#c9483b';
  ctx.fillText(mode === 'add' ? '● 쌓기 모드' : '● 빼기 모드', 270, 50);

  let note = null;
  if (message && performance.now() < message.until) note = message;
  else if (solved) note = { text: `성공! 목표 모양과 똑같아요`, color: '#2f9e5b' };
  if (note) {
    ctx.textAlign = 'right'; ctx.font = `900 30px ${FONT}`; ctx.fillStyle = note.color;
    ctx.fillText(note.text, PW - 36, 52); ctx.textAlign = 'left';
  }

  // 1줄: 목표
  ctx.fillStyle = '#4f6fb0'; ctx.font = `900 32px ${FONT}`;
  if (quiz >= 0) {
    ctx.fillText('목표', 40, 210);
    ctx.font = `500 20px ${FONT}`; ctx.fillStyle = '#6b7a99';
    ctx.fillText(`문제 ${quiz + 1}`, 42, 240);
    drawRow(ctx, 70, PRESETS[quiz], '#6f86b8', false);
  } else {
    ctx.fillStyle = '#7a6a55'; ctx.font = `700 30px ${FONT}`;
    ctx.fillText('자유롭게 쌓아 보세요.', 150, 150);
    ctx.font = `500 24px ${FONT}`;
    ctx.fillText('판 바로 앞에 있는 ‘문제’ 버튼을 가리키고', 150, 196);
    ctx.fillText('방아쇠(손은 핀치)를 누르면 도전이 시작돼요.', 150, 230);
    ctx.fillStyle = '#4f6fb0'; ctx.font = `700 24px ${FONT}`;
    ctx.fillText('컨트롤러 A·X 버튼 = 다음 문제   B·Y 버튼 = 쌓기/빼기 바꾸기', 150, 282);
  }

  // 2줄: 내 모양
  ctx.fillStyle = '#c27a2c'; ctx.font = `900 32px ${FONT}`;
  ctx.fillText('내 모양', 22, 490);
  drawRow(ctx, 350, h, '#d9a35b', true, quiz >= 0 ? PRESETS[quiz] : null);

  tex.needsUpdate = true;
}

// ---------- 쌓기나무 ----------
const cubeGeo = new THREE.BoxGeometry(CELL * 0.985, CELL * 0.985, CELL * 0.985);
const edgeGeo = new THREE.EdgesGeometry(cubeGeo);
const woodA = new THREE.MeshStandardMaterial({ color: '#e2b36f', roughness: 0.75 });
const woodB = new THREE.MeshStandardMaterial({ color: '#d29c55', roughness: 0.75 });
const edgeMat = new THREE.LineBasicMaterial({ color: '#7a5326' });
const cubes = new THREE.Group();
world.add(cubes);
let cubeMeshes = [];

const cellPos = (x, y, z, v = new THREE.Vector3()) =>
  v.set((x + 0.5) * CELL - HALF, (y + 0.5) * CELL, (z + 0.5) * CELL - HALF);

function rebuildCubes() {
  cubes.clear();
  cubeMeshes = [];
  for (let x = 0; x < N; x++) for (let z = 0; z < N; z++) for (let y = 0; y < h[x][z]; y++) {
    const m = new THREE.Mesh(cubeGeo, (x + y + z) % 2 ? woodA : woodB);
    cellPos(x, y, z, m.position);
    m.add(new THREE.LineSegments(edgeGeo, edgeMat));
    m.userData.cell = { x, y, z };
    cubes.add(m);
    cubeMeshes.push(m);
  }
}

// 놓일 자리 미리보기 (포인터마다 하나씩: 왼손, 오른손, 마우스)
function makeGhost() {
  const g = new THREE.Mesh(new THREE.BoxGeometry(CELL * 1.02, CELL * 1.02, CELL * 1.02),
    new THREE.MeshBasicMaterial({ color: '#36b37e', transparent: true, opacity: 0.35, depthWrite: false }));
  g.visible = false;
  world.add(g);
  return g;
}
const ghosts = [makeGhost(), makeGhost(), makeGhost()];

// ---------- 고르기 ----------
const raycaster = new THREE.Raycaster();
const tmpV = new THREE.Vector3();
const inb = v => v >= 0 && v < N;

function pick(rc, forceMode) {
  const m = forceMode || mode;
  const hits = rc.intersectObjects([...buttonMeshes, base, ...cubeMeshes], false);
  if (!hits.length) return null;
  const hit = hits[0];
  const o = hit.object;
  if (o.userData.button) return { type: 'button', id: o.userData.button, mesh: o, dist: hit.distance };

  let x, z, y;
  if (o === base) {
    const local = world.worldToLocal(hit.point.clone());
    x = Math.floor((local.x + HALF) / CELL); z = Math.floor((local.z + HALF) / CELL);
    if (!inb(x) || !inb(z)) return { type: m, valid: false, hidden: true, dist: hit.distance };
    if (m === 'remove') {
      if (h[x][z] === 0) return { type: 'remove', valid: false, hidden: true, dist: hit.distance };
      return { type: 'remove', valid: true, x, z, y: h[x][z] - 1, dist: hit.distance };
    }
    y = h[x][z];
    if (y >= H) return { type: 'add', valid: false, reason: '5층까지만 쌓을 수 있어요', x, y: H - 1, z, dist: hit.distance };
    return { type: 'add', valid: true, x, y, z, dist: hit.distance };
  }

  const c = o.userData.cell;
  if (m === 'remove') return { type: 'remove', valid: true, x: c.x, z: c.z, y: h[c.x][c.z] - 1, dist: hit.distance };
  const n = hit.face.normal;
  x = c.x + Math.round(n.x); y = c.y + Math.round(n.y); z = c.z + Math.round(n.z);
  if (!inb(x) || !inb(z)) return { type: 'add', valid: false, hidden: true, reason: '판 밖에는 놓을 수 없어요', dist: hit.distance };
  if (y < 0) return { type: 'add', valid: false, hidden: true, dist: hit.distance };
  if (y >= H) return { type: 'add', valid: false, hidden: true, reason: '5층까지만 쌓을 수 있어요', dist: hit.distance };
  if (h[x][z] < y) return { type: 'add', valid: false, reason: '공중에는 놓을 수 없어요!', x, y, z, dist: hit.distance };
  if (h[x][z] > y) return { type: 'add', valid: false, hidden: true, dist: hit.distance };
  return { type: 'add', valid: true, x, y, z, dist: hit.distance };
}

function showGhost(g, t) {
  if (!t || t.type === 'button' || t.hidden) { g.visible = false; return; }
  g.visible = true;
  cellPos(t.x, t.y, t.z, g.position);
  const red = t.type === 'remove' || !t.valid;
  g.material.color.set(red ? '#e5484d' : '#36b37e');
  g.material.opacity = t.type === 'remove' ? 0.55 : 0.35;
  g.scale.setScalar(t.type === 'remove' ? 1.06 : 1);
}

// ---------- 동작 ----------
let audio = null;
function beep(freq, dur = 0.07, type = 'sine', vol = 0.15) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  } catch (e) { /* 소리 없이 계속 */ }
}
function buzz(src, strength = 0.4, ms = 30) {
  try { src?.gamepad?.hapticActuators?.[0]?.pulse(strength, ms); } catch (e) {}
}
function say(text, color = '#c9483b', ms = 2200) {
  message = { text, color, until: performance.now() + ms };
  drawPanel();
  setTimeout(drawPanel, ms + 60);
}

function afterChange() {
  rebuildCubes();
  if (quiz >= 0) {
    const a = project(h), b = project(PRESETS[quiz]);
    const ok = count(h) > 0 && same(a.front, b.front) && same(a.side, b.side) && same(a.top, b.top);
    if (ok && !solved) {
      solved = true;
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.14, 'triangle', 0.12), i * 110));
      say(`성공! 내 쌓기나무 ${count(h)}개 · 목표 ${count(PRESETS[quiz])}개`, '#2f9e5b', 5000);
      return;
    }
    if (!ok) solved = false;
  }
  drawPanel();
}

function act(t, src) {
  if (!t) return;
  if (t.type === 'button') { pressButton(t.id); buzz(src, 0.3, 20); return; }
  if (t.type === 'add') {
    if (!t.valid) { if (t.reason) say(t.reason); beep(180, 0.12, 'square', 0.06); return; }
    h[t.x][t.z]++; beep(660 + t.y * 80); buzz(src, 0.5, 30); afterChange();
  } else if (t.type === 'remove') {
    if (!t.valid) return;
    h[t.x][t.z]--; beep(360); buzz(src, 0.3, 30); afterChange();
  }
}

function pressButton(id) {
  beep(880, 0.05);
  if (id === 'add' || id === 'remove') mode = id;
  else if (id === 'clear') { h = makeHeights(); solved = false; afterChange(); say('모두 치웠어요', '#7a6a55', 1500); }
  else if (id === 'quiz') {
    quiz = quiz + 1 >= PRESETS.length ? -1 : quiz + 1;
    h = makeHeights(); solved = false; mode = 'add'; afterChange();
    if (quiz >= 0) say(`문제 ${quiz + 1}: 목표 모양처럼 쌓아 보세요`, '#4f6fb0', 2500);
  }
  else if (id === 'move') {
    if (renderer.xr.isPresenting) { needPlace = true; placeFrames = 0; say('내 앞으로 옮겼어요', '#7a6a55', 1500); }
    else { camera.position.set(0.32, 0.5, 0.72); controls.target.set(0, 0.13, -0.05); controls.update(); }
  }
  drawButtons(); drawPanel();
}

// ---------- 헤드셋 컨트롤러 / 손 ----------
const controllers = [0, 1].map(i => {
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1)]),
    new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7 })
  );
  line.scale.z = 0.5;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.004), new THREE.MeshBasicMaterial({ color: '#ffd166' }));
  dot.visible = false;
  scene.add(dot);
  c.userData = { line, dot, src: null, ghost: ghosts[i] };
  c.addEventListener('connected', e => { c.userData.src = e.data; c.add(line); });
  c.addEventListener('disconnected', () => { c.userData.src = null; c.remove(line); dot.visible = false; ghosts[i].visible = false; });
  c.addEventListener('selectstart', () => act(pickFrom(c), c.userData.src));
  c.addEventListener('squeezestart', () => act(pickFrom(c, 'remove'), c.userData.src));
  scene.add(c);
  return c;
});
const rotM = new THREE.Matrix4();
function pickFrom(c, forceMode) {
  rotM.identity().extractRotation(c.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(rotM);
  raycaster.far = 3;
  return pick(raycaster, forceMode);
}

// MR/VR 시작
const btnAR = document.getElementById('btnAR');
const btnVR = document.getElementById('btnVR');
const status = document.getElementById('status');
let sessionMode = null, needPlace = false, placeFrames = 0;

async function startXR(kind) {
  try {
    beep(1, 0.01, 'sine', 0.0001); // 소리 장치 깨우기
    const session = await navigator.xr.requestSession(kind, {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hand-tracking'],
    });
    sessionMode = kind;
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);
  } catch (e) {
    status.textContent = '시작하지 못했어요: ' + e.message;
  }
}
btnAR.onclick = () => startXR('immersive-ar');
btnVR.onclick = () => startXR('immersive-vr');

renderer.xr.addEventListener('sessionstart', () => {
  controls.enabled = false;
  const ar = sessionMode === 'immersive-ar';
  scene.background = ar ? null : new THREE.Color('#dfe6ee');
  vrRoom.visible = !ar; floorGrid.visible = !ar;
  ghosts[2].visible = false;
  needPlace = true; placeFrames = 0;
});
renderer.xr.addEventListener('sessionend', () => {
  controls.enabled = true;
  scene.background = BG;
  vrRoom.visible = false; floorGrid.visible = false;
  world.position.set(0, 0, 0); world.rotation.set(0, 0, 0);
});

(async () => {
  if (!('xr' in navigator)) {
    status.textContent = '이 브라우저는 WebXR을 지원하지 않아요. PC 미리보기로 해볼 수 있어요.';
    return;
  }
  let ar = false, vr = false;
  try { ar = await navigator.xr.isSessionSupported('immersive-ar'); } catch (e) {}
  try { vr = await navigator.xr.isSessionSupported('immersive-vr'); } catch (e) {}
  btnAR.disabled = !ar; btnVR.disabled = !vr;
  status.textContent = ar || vr
    ? '헤드셋 준비 완료! 책상 앞에 앉아서 시작해 보세요.'
    : '헤드셋이 연결되지 않았어요. 지금은 PC 미리보기 모드예요.';
})();

// 사용자 눈앞, 책상 높이쯤으로 판을 옮기기
const camPos = new THREE.Vector3(), camDir = new THREE.Vector3();
function placeInFront() {
  // 헤드셋 사용 중에는 three.js가 이 카메라를 머리 위치로 맞춰 줌
  camera.getWorldPosition(camPos);
  camera.getWorldDirection(camDir);
  camDir.y = 0;
  if (camDir.lengthSq() < 1e-4) camDir.set(0, 0, -1);
  camDir.normalize();
  world.position.copy(camPos).addScaledVector(camDir, 0.42);
  world.position.y = camPos.y - 0.38;
  world.rotation.set(0, Math.atan2(-camDir.x, -camDir.z), 0);
}

// ---------- PC 마우스 ----------
const mouse = new THREE.Vector2();
let downAt = null;
function mouseRay(e) {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  raycaster.far = 10;
}
renderer.domElement.addEventListener('pointermove', e => {
  if (renderer.xr.isPresenting) return;
  mouseRay(e);
  const t = pick(raycaster, e.shiftKey ? 'remove' : null);
  showGhost(ghosts[2], t);
  hoverButtons(t ? [t] : []);
  renderer.domElement.style.cursor = t && (t.type === 'button' || t.valid) ? 'pointer' : 'default';
});
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || renderer.xr.isPresenting) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  downAt = null;
  if (moved > 6) return;
  mouseRay(e);
  const remove = e.button === 2 || e.shiftKey;
  act(pick(raycaster, remove ? 'remove' : null));
  showGhost(ghosts[2], pick(raycaster, remove ? 'remove' : null));
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

function hoverButtons(ts) {
  const hovered = new Set(ts.filter(t => t && t.type === 'button').map(t => t.mesh));
  for (const m of buttonMeshes) m.scale.setScalar(hovered.has(m) ? 1.1 : 1);
}

// ---------- 화면 접기 ----------
const uiBody = document.getElementById('uiBody');
document.getElementById('toggle').onclick = e => {
  const hide = uiBody.style.display !== 'none';
  uiBody.style.display = hide ? 'none' : '';
  e.target.textContent = hide ? '+' : '–';
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- 매 프레임 ----------
renderer.setAnimationLoop((time, frame) => {
  if (renderer.xr.isPresenting) {
    if (needPlace && frame && ++placeFrames > 4) { placeInFront(); needPlace = false; }
    const ts = [];
    for (const c of controllers) {
      const { line, dot, src, ghost } = c.userData;
      if (!src) continue;
      const t = pickFrom(c);
      ts.push(t);
      showGhost(ghost, t);
      if (t) {
        line.scale.z = t.dist;
        dot.visible = true;
        dot.position.copy(raycaster.ray.at(t.dist, tmpV));
      } else { line.scale.z = 0.5; dot.visible = false; }
    }
    hoverButtons(ts);
    // 컨트롤러 버튼 단축키: A/X(4) = 다음 문제, B/Y(5) = 쌓기·빼기 바꾸기
    for (const c of controllers) {
      const gp = c.userData.src?.gamepad;
      if (!gp) continue;
      const prev = c.userData.prevBtn || [];
      const now = [4, 5].map(i => !!gp.buttons[i]?.pressed);
      if (now[0] && !prev[0]) pressButton('quiz');
      if (now[1] && !prev[1]) pressButton(mode === 'add' ? 'remove' : 'add');
      c.userData.prevBtn = now;
    }
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
});

// 처음 그리기 (글꼴이 늦게 오면 한 번 더)
rebuildCubes(); drawButtons(); drawPanel();
document.fonts?.load(`900 40px "Noto Sans KR"`).then(() => {
  drawButtons(); drawPanel(); labels.forEach(l => l.userData.redraw());
}).catch(() => {});
</script>
